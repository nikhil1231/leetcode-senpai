# leetcode.nikhil.ing (Cloudflare Tunnel + Access) -> leetcode-senpai-web (Next.js), which forwards /api to the API
# container below. State lives in Firestore.
name: leetcode-senpai
services:
  leetcode-senpai:
    build: ./src
    image: infra-leetcode-senpai:${IMAGE_TAG:-current}
    container_name: leetcode-senpai
    mem_limit: 1g   # 128 MB peak (Oct 2026) plus the daily podcast's speech synthesis (~450 MB for a minute)
    restart: unless-stopped
    env_file: ${HOME}/secrets/leetcode-senpai.env
    environment:
      AUTH_MODE: access   # also in the env file; never rely on one place for this
      PORT: "8080"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ${HOME}/secrets/leetcode-senpai-c6af141359e2.json:/run/secrets/firebase.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
    networks: [default]   # only the web container talks to it now
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

  # The pages: Next.js from ./frontend/web (the same repo, cloned a second time by bin/deploy via FRONTEND_REPO), which
  # serves them and forwards /api/* to the API above. The address is baked in at build time.
  frontend:
    build:
      context: ./frontend/web
      args:
        API_URL: http://leetcode-senpai:8080
    image: infra-leetcode-senpai-frontend:${FRONTEND_TAG:-current}
    container_name: leetcode-senpai-web
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [leetcode-senpai]
    healthcheck:   # through the /api proxy, so a broken API or proxy shows here too
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 3s
    networks: [default, edge]   # edge: reachable by the cloudflared container
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}

networks:
  edge:
    external: true
