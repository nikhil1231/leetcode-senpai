# The overview of one area of the fundamentals course. Format and rules: server/tutor/overviews.py and the system
# design overviews (server/system_design_lessons/overviews/storage.yaml). Copy follows the Writing rules in CLAUDE.md.
area: languages
title: Languages and runtimes
minutes: 25
intro: |
  This tour covers the two topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Both steps have a simulator to try and end with a quick check.

  Ripple's services run on Java and Python, and when they misbehave under load the runtime is the first suspect: counts that come out low, a pool that never grows, an async service that freezes for seconds. This area is about what each runtime actually guarantees when several things happen at once. The full lessons go further, and the page keeps your place if you stop part-way.
