# The overview of one area of the fundamentals course. Format and rules: server/tutor/overviews.py and the system
# design overviews (server/system_design_lessons/overviews/storage.yaml). Copy follows the Writing rules in CLAUDE.md.
area: infrastructure
title: Cloud and delivery
minutes: 35
intro: |
  This tour covers the four topics in this area, one short step each. Every step follows the same pattern: a problem, the usual answer, its main drawback, and one fact worth keeping. Each step has a simulator to try and ends with a quick check.

  Ripple is moving onto Kubernetes on AWS, with a real pipeline from commit to production, and the platform is now part of your job. The last step is a case study of a smaller production system you know well: your own home server, the box this app is deployed to. The full lessons go further, and the page keeps your place if you stop part-way.
