  paths:
    - label: Ship a change
      steps:
        - [dev, ci, 'A merge runs lint, tests and the build in under ten minutes, and produces one image tagged with the commit (step 3).']
        - [ci, pods, 'That same image goes to staging, then to production as a canary on 5% of traffic, and rolls back on its own if errors rise (step 3).']
        - [ci, pods, 'Kubernetes replaces pods a few at a time and only sends traffic to new ones once their readiness probe passes (step 1).']
    - label: A creator's request
      steps:
        - [users, alb, 'Only the load balancer can be reached from the internet (step 2).']
        - [alb, pods, 'It forwards to pods in private subnets across two availability zones. Kubernetes keeps the number of pods at what was declared (step 1).']
        - [pods, rds, 'Each tier admits only the tier in front of it: the database accepts connections on port 5432 from the pods'' security group and nothing else (step 2).']
