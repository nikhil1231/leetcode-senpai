picture_note: |
  Press one of the requests under the diagram to follow it through the system. Ripple is a modular monolith: one deployable with clear modules inside. Notifications has been split out because a separate team owns it and its load is spiky; billing is being replaced piece by piece behind a facade rather than rewritten in one go (step 2).
steps:
  - lesson: lld-design
    title: Classes, SOLID and patterns
    minutes: 9
    problem: |
      Ripple's pricing lives in one 600-line class with a switch on the plan type. Adding a plan means editing it in five places, and its tests need the real payment provider. Separately, a low-level design interview asks you to model a parking lot in classes.
    answer: |
      **SOLID** names five habits that keep classes small and changeable:
      - **Single responsibility**: one reason to change. An invoice that calculates totals, renders a PDF and emails itself changes for three reasons.
      - **Open/closed**: add behaviour by adding code, not by editing a switch in five places.
      - **Liskov substitution**: a subtype must work anywhere its parent does. A read-only list that throws on `add()` breaks it.
      - **Interface segregation**: don't make clients depend on methods they don't use, such as a printer forced to implement `fax()`.
      - **Dependency inversion**: depend on interfaces passed in, not concrete classes created inside. A service that takes a `PaymentGateway` can be given Stripe in production and a fake in tests.

      Prefer **composition** (holding and delegating to other objects) over inheritance. Know the common patterns by the problem they solve: **strategy** (swap an algorithm), **observer** (notify listeners), **factory** and **builder** (create objects), **adapter** (fit a vendor's interface to yours), **decorator** (wrap to add retries or caching), **state** (behaviour that depends on state, like a vending machine).

      In the interview: clarify requirements and scope, list the entities, sketch classes and their relationships (UML: a filled diamond for ownership, a hollow triangle for inheritance), walk one use case through a sequence diagram, then show how the design absorbs a change.
    catch: |
      Patterns are tools, not decoration. A design with a factory, a builder and three interfaces for a problem that needed one class is harder to change, not easier. Singletons in particular are global state; inject one shared instance instead.
    remember: |
      A design is judged by how easily it absorbs the next change.
    use: lld-design/b4
    check: lld-design/b1
    later: [Composition over inheritance, Each pattern with an example, UML class and sequence diagrams, Running the round]
    recap: SOLID keeps classes small and changeable; patterns solve named problems. Inject dependencies, and add behaviour by adding classes.

  - lesson: architecture-styles
    title: Structuring the whole system
    minutes: 9
    problem: |
      Marcus proposes splitting Ripple's monolith into twelve microservices. Jo asks why. Separately, the old billing system needs replacing, and the last attempt at a full rewrite was abandoned after a year.
    answer: |
      Start with a **modular monolith**: one deployable, divided into modules by business area (links, billing, analytics), each with a narrow interface and ideally its own schema. Inside each, a **hexagonal** structure keeps the business logic in the middle and puts databases and providers behind interfaces (**ports**) with implementations (**adapters**).

      **Microservices** buy independent deployment and scaling per team, and isolation when something fails. They cost network calls, data you can no longer join or update in one transaction, contracts to version, and a lot of platform work. Split along business boundaries, when a team or a scaling need demands it. If one feature keeps needing three services deployed together, you've built a **distributed monolith**.

      Useful terms from **domain-driven design**: a **bounded context** is a boundary inside which words mean one thing ("customer" to billing is a payer, to support a person with tickets); an **aggregate** is a group of objects changed together under rules; an **anti-corruption layer** translates a legacy model so it doesn't leak into yours.

      A process across services uses a **saga**: local steps, each with a compensating step, coordinated either by events (**choreography**) or by one coordinator (**orchestration**). To replace a legacy system, use the **strangler fig**: put a routing facade in front, move one capability at a time to the new system, and retire the old one when nothing routes to it.
    catch: |
      Each of these has a cost. Choreography is hard to follow beyond a few steps, because the flow exists nowhere in the code. **CQRS** (separate models for writes and reads) and **event sourcing** (storing events rather than current state) add real complexity and earn it only in some domains. And the twelve-factor rules (config in the environment, stateless processes, logs to stdout, fast start and clean shutdown) still apply whichever style you pick.
    remember: |
      Start with a modular monolith, and split a module out when a team or a scaling need forces it.
    use: architecture-styles/b6
    check: architecture-styles/b1
    later: [Layered and hexagonal structures, Domain-driven design terms, Choreography versus orchestration, CQRS and event sourcing]
    recap: A modular monolith first, split along business boundaries when needed. Sagas coordinate across services; the strangler fig replaces legacy one piece at a time.
finish:
  check:
    type: predict
    prompt: |
      Notifications and billing are modules in Ripple's monolith. Notifications has its own team shipping daily and needs 50 times its normal capacity during campaigns. Billing changes weekly and its load is steady. What do you do?
    choices:
      - Split both into services, along with every other module
      - Split notifications into a service fed by events, and keep billing as a module
      - Keep both, and scale the whole monolith up for campaigns
      - Rewrite billing as a service first, because it handles money
    answer: 1
    reveal: |
      Notifications has both reasons to split: a separate team that deploys on its own schedule, and a load pattern unlike the rest of the system. Billing has neither, so splitting it would only add network calls and distributed transactions. Scaling the whole monolith for one module's spikes is expensive, and splitting everything at once is how teams end up with a distributed monolith.
  text: |
    That's the whole area. You don't need to remember all of it. The full lessons go through each piece properly, and each should feel familiar now.
