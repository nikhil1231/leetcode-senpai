# The overview of one area of the fundamentals course. Format and rules: server/tutor/overviews.py and the system
# design overviews (server/system_design_lessons/overviews/storage.yaml). Copy follows the Writing rules in CLAUDE.md.
area: architecture
title: Design and architecture
minutes: 25
intro: |
  This tour covers the two topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Both steps have something to try and end with a quick check.

  Ripple's codebase has outgrown its first design. Marcus wants to know which parts to split into services, and Jo wants to know why any of it matters. The first step is design inside one codebase (classes, interfaces, patterns); the second is how the codebase as a whole is structured, and when to split it. The full lessons go further, and the page keeps your place if you stop part-way.
