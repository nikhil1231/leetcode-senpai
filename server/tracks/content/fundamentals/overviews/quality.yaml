area: quality
title: Testing and reliability
minutes: 20
intro: |
  This tour is a single step, in the same pattern as the others: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping, with a simulator and a quick check.

  A release broke checkout on a Friday afternoon. Priya wants tests that would have caught it, and a plan for the next failure nobody has thought of yet. The step covers what each kind of test is for, from unit tests to deliberately breaking production. The full lesson goes further, and the page keeps your place if you stop part-way.
