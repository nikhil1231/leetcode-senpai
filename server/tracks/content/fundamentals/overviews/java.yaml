# The overview of one area of the fundamentals course. Format and rules: server/tutor/overviews.py and the system
# design overviews (server/system_design_lessons/overviews/storage.yaml). Copy follows the Writing rules in CLAUDE.md.
area: java
title: Java in depth
minutes: 40
intro: |
  This tour covers the five topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Each step has something to try or a quick check.

  Ripple's payments and links services are written in Java, and an interview for a Java role goes past syntax: what a variable actually holds, why a map loses entries, which method runs, where an exception went, and what the garbage collector is doing when latency spikes. The area goes from values and references up to the JVM itself. Threads and the memory model are in Languages and runtimes. The full lessons go further, and the page keeps your place if you stop part-way.
