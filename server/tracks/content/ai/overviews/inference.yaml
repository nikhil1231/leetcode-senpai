# The overview of one area of the AI course. Format and rules: server/tutor/overviews.py and the system design
# overviews (server/system_design_lessons/overviews/storage.yaml). Copy follows the Writing rules in CLAUDE.md.
area: inference
title: 'Under the hood: inference'
minutes: 30
intro: |
  This tour covers the three topics in this optional area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Each step has something to work out and ends with a quick check.

  Ripple is thinking about running its own open-weight models, and someone has to understand what the GPUs are doing. Almost everything here follows from two facts: a model is a large file of numbers that has to sit in the GPU's memory, and writing each token means reading all of it. The full lessons go further (the last one is an hour's lab on your own card), and the page keeps your place if you stop part-way.
