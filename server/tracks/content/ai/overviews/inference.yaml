    - [gpu, kv]
  paths:
    - label: One user's answer
      steps:
        - [user, engine, 'A 2,000-token prompt arrives.']
        - [engine, gpu, 'Prefill: all 2,000 tokens are processed together, reusing each weight many times. This is limited by arithmetic, and it sets the time to the first token (step 1).']
        - [gpu, weights, 'Decode: every new token needs every weight read once. For one user, the ceiling is 3,350 GB/s ÷ 16 GB, about 209 tokens a second (step 1).']
        - [gpu, kv, 'The keys and values for every token so far are kept, about 128 KB per token, so an 8,000-token conversation holds about 1 GB (step 1).']
    - label: Thirty-two users at once
      steps:
        - [engine, gpu, 'The engine puts 32 conversations into each step. One read of the weights now produces a token for all 32, so total throughput goes up many times (step 2).']
        - [gpu, kv, 'KV cache memory is handed out in small pages, so little is wasted. When it runs out, new requests wait or running ones are paused (step 2).']
    - label: On your own card
      steps:
        - [engine, gpu, 'An RTX 3070 reads memory at 448 GB/s. With a 4.9 GB model file, the decode ceiling is about 91 tokens a second, and you''d expect to measure 60 to 75% of it (step 3).']
        - [gpu, weights, 'A model file larger than the card''s 8 GB spills layers into much slower CPU memory, and decode speed collapses (step 3).']
picture_note: |
  Press one of the requests under the diagram to follow it through the system. The GPU's memory holds two things that compete for space: the weights, which are fixed, and the KV cache, which grows with every conversation and every token. Most of what serving engines do is about using that memory and each read of the weights as well as possible.
steps:
  - lesson: gpu-onramp
    title: What a GPU does with your prompt
    minutes: 8
    problem: |
      Marcus asks whether a 70-billion-parameter model will fit on one 80 GB GPU, and how fast it would answer a user.
    answer: |
      A model is a file of numbers called **weights**, and to generate quickly they must sit in the GPU's own fast memory. Memory needed = parameters × bytes per parameter: 2 bytes in BF16, 1 in FP8 or INT8, half a byte in 4-bit. So 70B in BF16 is 140 GB, too big for one 80 GB GPU; an 8B model is 16 GB.

      A GPU is limited either by how fast it does arithmetic or by how fast it reads memory (an H100 reads about 3.35 TB/s):
      - **Prefill** handles all the prompt's tokens in parallel, reusing each weight many times, so it's limited by arithmetic. It sets the time to first token.
      - **Decode** reads every weight to produce one token per conversation, so it's limited by memory bandwidth. One user's ceiling is bandwidth ÷ model size: 3,350 GB/s ÷ 16 GB ≈ 209 tokens a second.

      **Batching** is why serving is affordable: one read of the weights produces the next token for many conversations at once. Total throughput rises many times while each user slows a little. It's also why output tokens cost more than input: each one is a sequential step holding a place in the batch.

      Each conversation also needs a **KV cache**, the stored keys and values for every token so far: about 128 KB per token for an 8B model, so 8,000 tokens is about 1 GB. **Quantisation** stores weights in fewer bits, which saves memory and usually speeds up decode, at some loss of quality that you measure on your own evals.
    catch: |
      The KV cache often limits how many conversations fit at once more than the weights do, and it grows with every token. A GPU that comfortably holds the model can still run out of room under real traffic.
    remember: |
      One user's decode speed tops out at memory bandwidth ÷ model size in bytes.
    use: gpu-onramp/b1
    check: gpu-onramp/b7
    later: [Compute-bound and memory-bound in numbers, How batching changes per-user speed, Sizing the KV cache, Quantisation formats]
    recap: Weights must fit in GPU memory. Prefill is limited by arithmetic, decode by memory bandwidth, and batching shares each read across users.

  - lesson: inference-engines
    title: Serving engines
    minutes: 8
    problem: |
      Ripple's self-hosted chat model feels slow. The first words take three seconds, and whenever someone pastes in a long document, everyone else's replies stutter.
    answer: |
      Engines such as **vLLM**, SGLang and TensorRT-LLM are judged on a few numbers. **Time to first token** is queueing plus prefill. **Time per output token** is the gap between later tokens (30 to 50 ms reads comfortably). End-to-end latency ≈ time to first token + time per token × output tokens. **Goodput** counts only the requests that met their latency targets.

      Most of their cleverness is about GPU memory and decode steps:
      - **Continuous batching**: requests join and leave the batch between decode steps, so short requests don't wait for the longest one.
      - **PagedAttention**: the KV cache is stored in small fixed blocks, like pages of virtual memory, instead of reserving the maximum length for every request.
      - **Prefix caching**: the KV cache for a shared prefix, such as a 3,000-token system prompt, is kept and reused.
      - **Chunked prefill**: long prompts are split into chunks between decode steps, so other users' streams keep moving.
      - **Speculative decoding**: a small draft model proposes several tokens and the big model checks them in one pass, with exactly the same output. It helps at small batch sizes, and little when big batches already keep the GPU busy.

      Models too big for one GPU are split across several (each layer across GPUs in one machine, or layers across machines), or quantised (FP8, INT8, 4-bit AWQ or GPTQ).
    catch: |
      Bigger batches raise throughput but can lower goodput, because each user's tokens come more slowly. When KV memory runs out, the engine pauses requests and recomputes them later; if that happens often, the batch is too big.
    remember: |
      Concurrent requests ≈ free KV memory ÷ (bytes per token × tokens per request).
    use: inference-engines/b5
    check: inference-engines/b3
    later: [Measuring time to first token and time per token, Separate prefill and decode pools, Splitting models across GPUs, Choosing an engine]
    recap: Continuous batching, paged KV memory, prefix caching and chunked prefill make engines fast. Judge them by latency targets met, not throughput alone.

  - lesson: gpu-lab
    title: Serve a model on your own GPU
    minutes: 6
    problem: |
      Interviewers for AI platform roles ask, "Have you ever served a model yourself?" You have an RTX 3070 with 8 GB (448 GB/s) and an M2 MacBook Air.
    answer: |
      The lab is an hour of predicting, then measuring. Ollama and llama.cpp run natively on Windows and macOS; vLLM needs Linux, which on Windows means WSL2.
      - **Predict decode speed** from bandwidth: 448 GB/s ÷ a 4.9 GB 4-bit file ≈ 91 tokens a second as a ceiling. Expect to measure 60 to 75% of it. The M2's unified memory reads about 100 GB/s, so the same model runs at about a quarter of the speed.
      - **Measure prefill and decode separately** (`llama-bench` reports both). Prompt processing runs many times faster than generation, and time to first token grows with prompt length while decode speed barely changes.
      - **Run a model that doesn't fit.** Layers spill into CPU memory, which is many times slower, and decode collapses.
      - **Raise the context size** and watch GPU memory jump before any prompt arrives: the KV cache is reserved up front.
      - **Add concurrent requests**: total throughput rises while each user's speed falls.

      Then tell it as a story: the hardware and model, your prediction against what you measured, what broke the speed, and what batching did.
    catch: |
      Your numbers depend on drivers, the quantisation and what else is using the card (Windows and the display take part of the 8 GB). That's fine: the point is the reasoning and the comparison with your prediction, not a record.
    remember: |
      Predict from bandwidth before you measure, and a model that doesn't fit in GPU memory falls off a cliff.
    use: gpu-lab/b1
    check: gpu-lab/b3
    later: [Setting up Ollama or llama.cpp, Reading llama-bench output, The KV cache experiment, Telling the story in an interview]
    recap: Predict decode speed from bandwidth, measure prefill and decode, and see what offloading, context size and concurrency do.
finish:
  check:
    type: predict
    prompt: |
      Ripple wants to serve an 8B model in BF16 on one 80 GB GPU, for chats of up to 8,000 tokens. Roughly how many chats fit at once, and what limits it?
    choices:
      - About 5, limited by the GPU's arithmetic speed
      - About 60, limited by the memory left for the KV cache once the weights are loaded
      - No real limit, because decode only depends on memory bandwidth
      - One at a time, because each chat needs the whole GPU
    answer: 1
    reveal: |
      The weights take 16 GB, leaving roughly 64 GB. At about 128 KB per token, an 8,000-token chat needs about 1 GB of KV cache, so around 60 fit (a little fewer once the engine's own overhead is counted). Bandwidth decides how fast each step runs, not how many chats fit, and batching is exactly what lets many chats share one GPU.
  text: |
    That's the whole area. You don't need to remember all of it. The full lessons go through each piece properly, and each should feel familiar now.
