# The overview of one area (pass one). Format and rules: storage.yaml and server/tutor/overviews.py.
# Copy follows the Writing rules in CLAUDE.md.
area: reliability
title: Reliability and operations
minutes: 40
intro: |
  This tour covers the six topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Each step ends with a quick check, and most have a simulator to try first.

  Ripple has a pager now, and Priya carries it. This area is about the things that go wrong in production rather than on the whiteboard: too much traffic, a dependency that hangs, an alert that wakes someone for nothing, a migration that deletes the wrong rows, and the personal data that ends up everywhere. The full lessons go further, and the page keeps your place if you stop part-way.
