# The overview of one area (pass one): a short guided tour, one step per lesson, every step the same shape.
# Loaded and checked by server/tutor/overviews.py. `use` and `check` name a block of the step's lesson
# ("lesson/key", answers recorded on that lesson) or are a block written here (answers kept with the overview).
# Copy follows the Writing rules in CLAUDE.md.
area: storage
title: Databases and storage
minutes: 35
intro: |
  This tour covers the eight topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Most steps end with a quick check or something to try.

  It stays at the level of what each piece is for and where it fits. The full lessons go into how each one works, and they'll be easier to follow once you've seen the whole area. The page keeps your place if you stop part-way.
picture:
  title: Where each topic fits in Ripple
  plain: true
  nodes:
    - {id: app, label: Creators and visitors, kind: client, x: 0, y: 1}
    - {id: api, label: Ripple API, kind: service, x: 1, y: 1, note: 'checks rules, picks IDs'}
    - {id: db, label: Postgres, kind: db, x: 2, y: 1, note: 'links, creators, follows'}
    - {id: disk, label: Disk, kind: storage, x: 3, y: 1, note: 'log and data files'}
    - {id: files, label: Object storage, kind: storage, x: 2, y: 0, note: 'images and videos'}
  edges:
    - [app, api, 'requests']
    - [api, db, 'SQL']
    - [db, disk, 'writes']
    - [app, files, 'uploads']
  paths:
    - label: Show a creator's links
      steps:
        - [app, api, 'GET /creators/17/links. The API checks who is asking.']
        - [api, db, 'It asks Postgres for creator 17''s 20 newest links. An index on (creator_id, created_at) finds them without reading the whole table (step 3).']
        - [api, app, 'The page comes back. Each link has an ID in its URL, and how that ID was chosen is step 8.']
    - label: Create a link
      steps:
        - [app, api, 'POST /links. The API checks the free-plan limit and picks an ID for the new link (step 8).']
        - [api, db, 'It counts the creator''s links and inserts the new one in a single transaction, so two requests at once can''t both get under the limit (step 4).']
        - [db, disk, 'Postgres writes the change to its log on disk before it reports success, so a crash can''t lose it (step 5).']
    - label: Upload a cover image
      steps:
        - [app, api, 'The app asks the API for permission to upload. The API checks the creator is allowed to (step 7).']
        - [api, db, 'The API records the image as "pending" (owner, file key, expected size) and returns a short-lived signed upload URL.']
        - [app, files, 'The app sends the bytes straight to object storage using that URL, so the API never has to carry them.']
picture_note: |
  Press one of the requests under the diagram to follow it through the system. Two topics don't have a box of their own. The follows table lives in Postgres, and questions like "people you may know" are where graph data (step 2) comes in. Every record and message format has to keep working while the code around it changes, which is encoding and schema evolution (step 6). The shape of the rows themselves is step 1.
steps:
  - lesson: data-models
    title: Choose the shape of your data
    minutes: 4
    problem: |
      Sam wants three features this month: saved collections of links, click counts per link, and creator profiles where different kinds of creator fill in different fields. Each needs somewhere to live. So far Ripple has put everything in Postgres tables, and the question is whether that still fits.
    answer: |
      Start from how the data will be used rather than from a product. Write down the main queries (how often, how fast), the writes, the rules that must always hold, and anything that grows without limit. Then pick the model that makes those cheap:
      - **Relational** (Postgres, MySQL): records that refer to each other, rules such as foreign keys, and changes to several rows at once.
      - **Document** (MongoDB, Firestore): self-contained records with varying fields, read as a whole.
      - **Key-value** (Redis, DynamoDB): lookups by a single key, at very large scale.
      - **Wide-column** (Cassandra, Bigtable): very high write rates, read back by key and time range.
    catch: |
      Each model makes some queries cheap and others awkward. Copying data so a page can be read in one go (denormalising) means every write has to update every copy, and copies can end up disagreeing.
    remember: |
      Postgres covers most products well, including varying fields in a JSONB column. Move a workload to another kind of store when a particular query or write rate needs it, and be ready to say which one.
    check:
      type: sort
      prompt: Which model fits each workload best? Some models fit more than one.
      buckets: [Relational, Document, Key-value, Wide-column]
      items:
        - {text: 'Orders, payments and refunds that must stay consistent with each other', bucket: 0, why: 'Records that refer to each other, rules and multi-row transactions are what relational databases are built for.'}
        - {text: 'Creator profiles where each kind of creator has different fields, always shown whole', bucket: 1, why: 'Varying fields read together suit a document (or a JSONB column in Postgres).'}
        - {text: 'Login sessions looked up by token and expiring after an hour', bucket: 2, why: 'The only query is by key, with an expiry. A key-value store fits exactly.'}
        - {text: 'Every click on every link, millions a day, read back per link by date', bucket: 3, why: 'Very high write rate, read by key and time range: partition by link, sort by time.'}
        - {text: 'Teams, their members and the links each team owns, with permission checks', bucket: 0, why: 'Several related tables and rules that must hold across them.'}
        - {text: 'Rendered link previews, fetched by URL', bucket: 2, why: 'Fetched by one key and nothing else, so a key-value store (often a cache) fits.'}
        - {text: 'Readings from 10,000 sensors, queried by sensor and time range', bucket: 3, why: 'Same shape as the clicks: lots of writes, read per sensor over time.'}
    later: [Partition and sort keys in wide-column stores, Records that grow without limit, 'Changing a schema without downtime']
    recap: Pick the model from the queries, writes and rules. Postgres covers most cases.

  - lesson: graph-data
    title: When the relationships are the data
    minutes: 3
    problem: |
      Ripple wants a "people you may know" list: people followed by the people you follow. In Postgres that's a `follows` table joined to itself, once for each step outwards (each "hop").
    answer: |
      Two or three hops in SQL work well: an indexed `follows` table and a recursive query with a limit on depth. A graph database such as Neo4j is worth it when questions follow an unknown number of hops and you ask them constantly, as in fraud detection, dependency chains or route finding.
    catch: |
      The number of people reached grows very quickly with each hop. Graphs are also hard to split across machines, because any connection can point anywhere.
    remember: |
      With 200 follows each, one hop reaches 200 people, two hops about 40,000 and three hops about 8 million, so limit the depth.
    check: graph-data/b8
    later: [Property graphs and Cypher, Recursive SQL that copes with cycles, Why a graph is hard to shard]
    recap: SQL is fine for a few hops. A graph database is for many hops, asked often.

  - lesson: indexes
    title: Finding rows quickly
    minutes: 5
    problem: |
      The "your links" page gets slower every week. It shows one creator's 20 newest links, and Postgres reads every row in the table to find them.
    answer: |
      An **index** is a sorted copy of some columns with pointers back to the rows, usually kept as a B-tree. Because it's sorted, Postgres can go straight to one creator's links, already in date order, and stop after 20. An index on `(creator_id, created_at)` does this.
    catch: |
      The order of the columns matters. That index helps queries that filter on `creator_id`, but not ones that filter on `created_at` alone. Every index is also updated on every write, so each extra one slows inserts and takes disk space and memory.
    remember: |
      A B-tree over a billion rows is only three or four levels deep, so a lookup reads a handful of pages.
    use: indexes/b5
    use_note: The first challenge is enough for now (get the rows read down to 20). The others are for the full lesson.
    later: [The leftmost-prefix rule, 'Covering, partial and expression indexes', Reading a query plan, Queries that can't use an index]
    recap: An index is a sorted copy of some columns. Column order decides which queries it helps, and every index slows writes.

  - lesson: transactions
    title: Keeping simultaneous changes safe
    minutes: 5
    problem: |
      Ripple adds a free plan with a limit of 10 links. Two requests from the same creator arrive at the same moment. Both read "9 links used", both pass the check, and both create a link, so the creator ends up with 11.
    answer: |
      A **transaction** groups changes so that either all of them happen or none do, and once it commits the change survives a crash. It only protects you from other transactions as far as its **isolation level** promises, and the usual default (Read Committed) doesn't prevent this race. The fix is to let the database do the check and the change in one step: a conditional update (`UPDATE … SET used = used + 1 WHERE used < 10`), a unique constraint, or a row lock.
    catch: |
      The strictest level (Serializable) prevents more of these races, but it reduces throughput and some transactions fail and have to be retried. A rollback also can't undo things outside the database, such as an email already sent.
    remember: |
      Reading a value, checking it and then writing can lose an update even inside a transaction. Rules such as "this name is unique" belong in a unique index, not in a check in the application.
    use: transactions/b1
    later: ['The named anomalies: dirty reads, lost updates, write skew', 'Choosing between locks, version checks and Serializable', Deadlocks and long transactions]
    recap: A transaction is all-or-nothing and durable. The isolation level decides which races can still happen.

  - lesson: storage-engines
    title: How data is kept on disk
    minutes: 4
    problem: |
      Ripple wants to record every click, about 50 times as many writes as link creation. Marcus also wants a monthly report across all of them. A layout that's good for one of these jobs is poor for the other.
    answer: |
      Every database first appends each change to a **write-ahead log**. Once that's flushed to disk the commit is safe, and after a crash the log is replayed. Below that, storage engines lay data out in different ways:
      - **B-tree** engines (Postgres, MySQL) update pages in place. They're good for reads and transactions.
      - **LSM-tree** engines (Cassandra, RocksDB) write every change as a sequential append and merge files later. They suit heavy write streams such as clicks.
      - **Column stores** (BigQuery, ClickHouse) keep each column together, so a report that reads 2 of 30 columns reads only a small part of the data.
    catch: |
      LSM trees get their fast writes by merging files in the background, which costs disk work and makes reads slower. Column stores are slow at writing single rows, so data is loaded in batches.
    remember: |
      For mostly writes of recent data, an LSM engine. For mostly reads and transactions, a B-tree. For reports over many rows, a column store.
    check: storage-engines/b3
    later: [B-tree pages and splits, LSM compaction and Bloom filters, 'Read, write and space amplification', Recovering from a crash using the log]
    recap: The log makes commits safe. B-trees suit reads, LSM trees suit writes, column stores suit reports.

  - lesson: encoding-evolution
    title: Changing data formats safely
    minutes: 4
    problem: |
      Ripple deploys the API one server at a time, so for about ten minutes old and new code run side by side, reading the same rows and queue messages. The new code adds a field to a record. The old code doesn't know about it and drops it when it saves the record again.
    answer: |
      Data outlives the code that wrote it, so a format has to work in both directions. New code must read old data (**backward compatible**), and old code must read new data (**forward compatible**). In practice: add new fields as optional with a default, never reuse a field's name or number for something else, and remove a field only once nothing reads it. JSON has no schema to check this. Protocol Buffers and Avro use a schema, so tools can check these rules for you.
    catch: |
      Schema formats are smaller and safer to change, but they need tooling: schema files, generated code and sometimes a registry. JSON needs none of that, so the rules depend on everyone following them.
    remember: |
      During a rolling deploy, old and new code read each other's data, so every change to a format has to be safe in both directions.
    use: encoding-evolution/b1
    use_note: Pick one change and look at whether it's safe in each direction. That's enough for now.
    later: [Field numbers in Protocol Buffers, Reader and writer schemas in Avro, Schema registries for event streams]
    recap: A format must be readable by older and newer code at the same time.

  - lesson: object-storage
    title: Where large files go
    minutes: 4
    problem: |
      Creators can now upload a cover image for each link. The first version sends the image through the API and stores it in a Postgres column. Then a few creators upload 20 MB videos over slow phone connections, and the whole API slows down while it waits on them.
    answer: |
      Large files go in **object storage** (S3, Google Cloud Storage, R2), which is cheap, very durable and has no practical size limit. The database keeps the facts you query: owner, status, size, and the key where the file lives. The API still decides who may upload: it checks the request, records the file as pending and returns a short-lived **presigned URL**. The app then sends the bytes straight to object storage with that URL, so the API never carries them.
    catch: |
      Object storage isn't a filesystem or a database. The first byte takes tens of milliseconds, files can't be renamed cheaply, and you can't query what's inside them. And because the file and its record live in two systems, you need a plan for a crash between the two, such as cleaning up records that stay pending.
    remember: |
      The file goes to object storage and its details go in the database. The API authorises the upload but doesn't carry the bytes.
    check: object-storage/b1
    later: [Keeping presigned URLs safe, Uploading large files in parts, The crash between the file and its record, Lifecycle rules and download costs]
    recap: Files go in object storage, their details in the database, and uploads go direct with a signed URL.

  - lesson: id-generation
    title: Choosing an ID scheme
    minutes: 3
    problem: |
      Ripple's links use auto-increment IDs. Anyone can see that link 48,213 was made this morning and link 48,900 this evening, and work out how fast Ripple is growing. They can also guess the next link's address.
    answer: |
      Choose the scheme by what the ID is for:
      - **Auto-increment**: small and in order. Fine for internal tables on one database.
      - **UUIDv4**: random, so it can't be guessed, and any server can make one. Good for tokens.
      - **UUIDv7 or ULID**: ordered by time and made by any server. A good default for public IDs.
      - **Snowflake**: 64 bits and ordered by time, for very high rates across many machines. Each machine needs its own worker number.
    catch: |
      IDs ordered by time reveal when something was created. Random IDs spread inserts all over the index, which slows writes on large tables.
    remember: |
      Public IDs are part of your API, so they shouldn't reveal how much you have or let people guess other records.
    check:
      type: sort
      prompt: Which ID scheme fits each case?
      buckets: [Auto-increment, UUIDv4, UUIDv7 / ULID, Snowflake]
      items:
        - {text: 'Rows in an internal admin table on a single Postgres server', bucket: 0, why: 'Internal and on one database, so being central and guessable does no harm.'}
        - {text: 'A password-reset token that must be impossible to guess', bucket: 1, why: 'Pure randomness and nothing about time or order.'}
        - {text: 'Notes created on a phone while offline, synced later and sorted by time', bucket: 2, why: 'Made without asking a server, and still sortable by creation time.'}
        - {text: 'Message IDs at 100,000 a second across 500 servers, in 64 bits', bucket: 3, why: 'Time-ordered, compact and made without coordination per ID.'}
        - {text: 'An API key handed to a developer', bucket: 1, why: 'A secret, so it should be random.'}
        - {text: 'Public link IDs that sort by creation time without showing how many links exist', bucket: 2, why: 'Time-ordered but not a running count, so volume stays hidden.'}
        - {text: 'Line items on invoices that only internal services ever see', bucket: 0, why: 'Internal, one database, so a counter is simplest.'}
    later: [Why random keys slow B-tree inserts, How Snowflake splits its 64 bits, Short public codes]
    recap: Pick IDs by purpose. Time-ordered IDs reveal when, random IDs slow down large indexes.
finish:
  check:
    type: arch
    title: Back to Ripple
    prompt: Creators now want to attach 20 MB videos to their links. Which component belongs in the empty box?
    nodes:
      - {id: app, label: Creators and visitors, kind: client, x: 0, y: 1}
      - {id: api, label: Ripple API, kind: service, x: 1, y: 1}
      - {id: db, label: Postgres, kind: db, x: 2, y: 1}
      - {id: files, label: Object storage, kind: storage, x: 2, y: 0}
    edges:
      - [app, api]
      - [api, db]
      - [app, files]
    missing: files
    choices:
      - A larger disk on the Postgres server, with each video in a column
      - A Redis cache in front of Postgres
      - Object storage, with Postgres keeping each video's owner, status and key
      - The API servers' local disks, with each video served from there
    answer: 2
    explain: |
      Large files go to object storage, and the app uploads them directly with a signed URL from the API. Postgres keeps the details you query. A video column would bloat the database and its backups, a local disk is lost when the server is replaced, and Redis keeps data in memory, which is far too expensive for video.
  play: [r2, r5]
  text: |
    That's the whole area. You don't need to remember all of it. The full lessons go through each piece properly, and each should feel familiar now.
