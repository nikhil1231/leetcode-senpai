    - {id: dlq, label: Dead letters, kind: queue, x: 4, y: 0, note: 'for a person to look at'}
    - {id: db, label: Postgres, kind: db, x: 2, y: 1, note: 'links, outbox table'}
    - {id: log, label: Event log, kind: stream, x: 3, y: 1, note: 'Kafka, kept 7 days'}
    - {id: stream, label: Stream processor, kind: process, x: 4, y: 1, note: 'live click counts'}
    - {id: batch, label: Nightly batch, kind: worker, x: 3, y: 2, note: 'monthly reports'}
