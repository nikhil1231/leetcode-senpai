# The overview of one area (pass one). Format and rules: storage.yaml and server/tutor/overviews.py.
# Copy follows the Writing rules in CLAUDE.md.
area: queues
title: Queues and background processing
minutes: 40
intro: |
  This tour covers the eight topics in this area, one short step each. Every step follows the same pattern: a problem at Ripple, the usual answer, its main drawback, and one fact worth keeping. Each step ends with a quick check, and a few have a simulator to try first.

  Ripple now renders link previews, sends emails and counts every click. None of that should make a creator wait, so the work moves off the request path into queues and logs. The area is about keeping the guarantees when it does: nothing lost, nothing done twice by accident, and every copy of the data eventually agreeing. The full lessons go further, and the page keeps your place if you stop part-way.
