- id: ai.design-research-agent.agree-time-cost-budget
  subtopic: 1. Clarify
  kind: procedure
  claim: 'Agree a time and cost ceiling per report up front, and what happens at the limit: stop and write up what''s known.'
  prompt: What budgets do you clarify for a research agent?
  objectives:
  - 0
- id: ai.design-research-agent.lead-agent-plans
  subtopic: 2. Architecture
  kind: mechanism
  claim: A lead agent on a strong reasoning model plans sub-questions, decides how much effort a question deserves, and decides when there's enough to write.
  prompt: What does the lead agent do in a research system?
  objectives:
  - 1
- id: ai.design-research-agent.parallel-subagents-fresh-context
  subtopic: 2. Architecture
  kind: tradeoff
  claim: Sub-agents with fresh contexts, one sub-question each and cheaper models, run in parallel and return short findings, cutting wall-clock time at the cost of more total tokens.
  prompt: Why use parallel sub-agents with fresh contexts?
  objectives:
  - 1
  requires:
  - ai.agents.sub-agents-fresh-context
- id: ai.design-research-agent.notes-outside-context
  subtopic: 2. Architecture
  kind: principle
  claim: Keep full fetched sources in a notes store keyed by job and only references and summaries in contexts, so contexts stay small.
  prompt: Where should a research agent keep what it has read?
  objectives:
  - 1
  requires:
  - ai.agents.context-management-techniques
- id: ai.design-research-agent.citation-checker
  subtopic: 2. Architecture
  kind: mechanism
  claim: A checker confirms each cited snippet exists in the stored source and supports its claim; unsupported claims are cut or stated as gaps.
  prompt: How does a research system make citations trustworthy?
  objectives:
  - 1
  - 3
  requires:
  - ai.rag.citation-post-check
- id: ai.design-research-agent.background-job-with-progress
  subtopic: 2. Architecture
  kind: principle
  claim: Long agent tasks run as background jobs that stream progress events and notify on completion.
  prompt: How should a minutes-long research task be run?
  objectives:
  - 3
- id: ai.design-research-agent.agent-input-cost-dominates
  subtopic: 2. Architecture
  kind: mechanism
  claim: In long agent runs input cost dominates because each step resends the growing context; prompt caching and trimming old tool results are the main levers.
  prompt: Why does input dominate the cost of a long agent run?
  objectives:
  - 1
  requires:
  - ai.agents.context-growth-problem
- id: ai.design-research-agent.budgets-enforced-in-code
  subtopic: 3. Control, safety and quality
  kind: principle
  claim: Budgets on agents, steps, tokens, time and money are enforced in the orchestrator's code, with a graceful stop that writes up partial findings.
  prompt: How are a research agent's budgets enforced?
  objectives:
  - 2
  same_as: ai.agents.loop-budgets
- id: ai.design-research-agent.lethal-trifecta
  subtopic: 3. Control, safety and quality
  kind: fact
  claim: The lethal trifecta is private data access, exposure to untrusted content and a way to send data out, all in one agent, which lets injected content cause leaks.
  prompt: What is the lethal trifecta?
  objectives:
  - 2
- id: ai.design-research-agent.break-trifecta-by-tools
  subtopic: 3. Control, safety and quality
  kind: procedure
  claim: 'Break the trifecta in tool design: separate web and internal agents, fetch only URLs search returned, and give no write or send tools.'
  prompt: How do you stop a research agent leaking data?
  objectives:
  - 2
- id: ai.design-research-agent.citation-precision
  subtopic: 3. Control, safety and quality
  kind: fact
  claim: Citation precision is the share of citations that support their claim, checked automatically against stored snippets.
  prompt: What is citation precision?
  objectives:
  - 3
  requires:
  - ai.design-research-agent.citation-checker
- id: ai.design-research-agent.research-agent-evals
  subtopic: 3. Control, safety and quality
  kind: procedure
  claim: 'Evaluate research agents on expert-written questions: coverage and correctness by validated judges, citation precision, trajectory waste, cost and time per report, and consistency across runs.'
  prompt: How do you evaluate a research agent?
  objectives:
  - 3
