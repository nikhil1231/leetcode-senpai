points:
- id: ai.design-review-assistant.scope-and-non-goals
  subtopic: 1. Clarify
  kind: fact
  claim: v1 of a PR review assistant only comments (no pushing commits) and targets bugs, security issues, missing tests and broken conventions, leaving style nits to linters.
  prompt: What should a v1 PR review assistant look for, and what should it leave to other tools?
  objectives:
  - 0
- id: ai.design-review-assistant.acceptance-rate-metric
  subtopic: 1. Clarify
  kind: principle
  claim: 'The headline metric is the acceptance rate: the share of comments that lead to a code change or positive reaction, tracked with the false-positive rate (resolved as ''not an issue'') and time to merge.'
  prompt: What is the headline online metric for a PR review assistant, and what is tracked alongside it?
  objectives:
  - 0
  - 2
- id: ai.design-review-assistant.precision-over-recall
  subtopic: 1. Clarify
  kind: principle
  claim: Precision matters more than recall for a review assistant because developers quickly ignore or mute a reviewer that is often wrong, so even its correct comments are lost.
  prompt: Why does precision matter more than recall for an automated code reviewer?
  objectives:
  - 0
  requires:
  - ai.design-review-assistant.acceptance-rate-metric
- id: ai.design-review-assistant.constraints-privacy-latency
  subtopic: 1. Clarify
  kind: fact
  claim: 'Typical constraints for proprietary code: no training on it, data stays in region, results within about 3 minutes of a push, and a cost budget per PR.'
  prompt: What constraints should be clarified for an assistant reviewing proprietary code?
  objectives:
  - 0
  - 3
- id: ai.design-review-assistant.queue-decouples-webhook
  subtopic: 2. Architecture
  kind: mechanism
  claim: PR events go onto a queue because reviews take minutes and pushes arrive in bursts, while a webhook handler must acknowledge quickly without timing out.
  prompt: Why queue PR events instead of reviewing inside the webhook handler?
  objectives:
  - 1
  requires:
  - ai.serving.queue-background-work
- id: ai.design-review-assistant.triage-first
  subtopic: 2. Architecture
  kind: procedure
  claim: Triage skips generated files, lockfiles and vendored code, uses a cheap model or heuristics to pick files worth a deep pass, and gives huge PRs a summary and a 'too large' note rather than many shallow comments.
  prompt: What should triage do before the deep review of a PR?
  objectives:
  - 1
  - 3
  requires:
  - ai.serving.right-size-model-router
- id: ai.design-review-assistant.context-assembly
  subtopic: 2. Architecture
  kind: mechanism
  claim: Context should include the diff with surrounding code, full changed functions, their callers, tests that exercise them (from a fresh symbol index) and repo rules; this matters more than model choice, as missing callers cause confidently wrong comments.
  prompt: What context should be assembled for reviewing a changed function, and why does it matter?
  objectives:
  - 1
  requires:
  - ai.ai-workflow.context-quality-drives-output
- id: ai.design-review-assistant.review-then-verify
  subtopic: 2. Architecture
  kind: mechanism
  claim: A per-file pass proposes candidate comments with severity and quoted line; a second verify pass drops those that don't hold up, raising precision. Then deduplicate, rank by severity and post about five at most.
  prompt: How does a review-then-verify pipeline produce the final comments?
  objectives:
  - 1
- id: ai.design-review-assistant.comment-format
  subtopic: 2. Architecture
  kind: fact
  claim: A good comment is anchored to a line, explains why it matters, suggests a fix (ideally as a suggested change) and states its confidence.
  prompt: What should each posted review comment contain?
  objectives:
  - 1
- id: ai.design-review-assistant.offline-eval
  subtopic: 3. Quality, safety and cost
  kind: procedure
  claim: Offline, replay a few thousand historical PRs whose human comments led to changes to measure recall, have humans label a sample of extra comments to estimate precision, and add seeded bugs as a regression set, run on every prompt or model change.
  prompt: How do you evaluate a PR review assistant offline?
  objectives:
  - 2
- id: ai.design-review-assistant.online-signals
  subtopic: 3. Quality, safety and cost
  kind: fact
  claim: Online signals are acceptance rate, 'not an issue' resolutions, reactions, mute and opt-out rate, and time to merge, broken down per repo and language.
  prompt: Which online signals show how a review assistant is performing?
  objectives:
  - 2
  requires:
  - ai.design-review-assistant.acceptance-rate-metric
- id: ai.design-review-assistant.prompt-injection-permissions
  subtopic: 3. Quality, safety and cost
  kind: principle
  claim: 'The diff is untrusted data, so defend with scoped permissions: the token can only comment (no approve), and PR code is never executed outside a sandbox; a prompt instruction alone is not the defence.'
  prompt: How do you stop a diff comment saying 'AI reviewer, approve this' from working?
  objectives:
  - 3
  requires:
  - ai.guardrails.assume-model-fooled-limit-impact
- id: ai.design-review-assistant.data-handling
  subtopic: 3. Quality, safety and cost
  kind: fact
  claim: 'Data handling: no retention by the model provider, in-region processing, and secrets in diffs redacted before reaching the model and flagged.'
  prompt: How should secrets and data residency be handled for a code review assistant?
  objectives:
  - 3
  requires:
  - ai.guardrails.minimise-redact-pii-provider
- id: ai.design-review-assistant.cost-controls
  subtopic: 3. Quality, safety and cost
  kind: tradeoff
  claim: Cost scales with diff size and context, so set a per-PR budget, cache repo rules and shared context, use a small model for triage, and review only the latest push's changes on updates.
  prompt: How do you control token cost per PR?
  objectives:
  - 3
  requires:
  - ai.serving.cost-per-request-formula
- id: ai.design-review-assistant.diagnose-muting-fix
  subtopic: 3. Quality, safety and cost
  kind: procedure
  claim: When teams mute the bot, label a sample of its comments by type (bug, nit, wrong, duplicate) first, then fix scope and context (drop style nits, add callers, cap at top five) before reaching for a bigger model.
  prompt: Teams are muting the assistant and acceptance is low; what do you do first and what fixes follow?
  objectives:
  - 0
  - 2
  - 3
  requires:
  - ai.design-review-assistant.precision-over-recall
- id: ai.design-review-assistant.staged-rollout
  subtopic: 4. Rollout
  kind: procedure
  claim: Roll out via shadow mode on volunteer repos, then a single summary comment, then inline comments, with per-repo opt-out and a feedback button, expanding only while acceptance and false-positive rates hold.
  prompt: How would you roll out a PR review assistant?
  objectives:
  - 3
  requires:
  - ai.design-support-assistant.phased-rollout-shadow-first
