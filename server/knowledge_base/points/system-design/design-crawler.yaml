points:
- id: sd.design-crawler.fetch-rate-estimate
  subtopic: 2. Estimates
  kind: procedure
  claim: 1B pages/day divided by 86,400 seconds is about 11,600 fetches per second (roughly 12k/s); 2B/day is about 23k/s.
  prompt: What average fetch rate does a crawler need to fetch 1 billion pages per day?
  objectives:
  - 0
  requires:
  - sd.estimates.daily-to-per-second
- id: sd.design-crawler.bandwidth-estimate
  subtopic: 2. Estimates
  kind: procedure
  claim: At about 100 KB per page, 11,600 fetches/s is roughly 1.2 GB/s of page data before compression.
  prompt: Roughly how much page data per second does a 1B pages/day crawler handle at 100 KB per page?
  objectives:
  - 0
  requires:
  - sd.design-crawler.fetch-rate-estimate
  - sd.estimates.bandwidth-formula
- id: sd.design-crawler.concurrency-littles-law
  subtopic: 2. Estimates
  kind: procedure
  claim: With about 1 s per fetch, Little's Law gives about 11,600 fetches in flight at once, so tens of thousands of concurrent connections across the fleet.
  prompt: How many concurrent fetches does a 1B pages/day crawler need if each fetch takes about 1 second?
  objectives:
  - 0
  requires:
  - sd.design-crawler.fetch-rate-estimate
  - sd.service-quality.littles-law
- id: sd.design-crawler.storage-estimate
  subtopic: 2. Estimates
  kind: procedure
  claim: At about 30 KB compressed per page, 1B pages/day is about 30 TB per day of raw pages, kept in object storage in batched archive files (WARC).
  prompt: How much raw storage per day does a 1B pages/day crawler need at 30 KB compressed per page?
  objectives:
  - 0
  requires:
  - sd.estimates.storage-formula
- id: sd.design-crawler.constraints-not-throughput
  subtopic: 2. Estimates
  kind: principle
  claim: Raw crawl throughput is embarrassingly parallel; the constraints that shape the design are politeness and deduplication.
  prompt: What actually shapes a crawler's design more than raw throughput?
  objectives:
  - 0
- id: sd.design-crawler.global-fifo-impolite
  subtopic: '3. The frontier: priority and politeness'
  kind: principle
  claim: A single global FIFO or priority queue ignores hosts, so many fetchers can hit the same site at once, which overloads it and gets the crawler blocked.
  prompt: Why is a single global queue frontier a problem for a crawler?
  objectives:
  - 1
- id: sd.design-crawler.mercator-front-queues
  subtopic: '3. The frontier: priority and politeness'
  kind: mechanism
  claim: In a Mercator frontier, front queues hold URLs by priority score (importance, freshness need), and a router then moves them into per-host back queues.
  prompt: What do the front queues and back queues in a Mercator-style frontier do?
  objectives:
  - 1
  requires:
  - sd.design-crawler.global-fifo-impolite
- id: sd.design-crawler.host-next-allowed-heap
  subtopic: '3. The frontier: priority and politeness'
  kind: mechanism
  claim: A heap of per-host next-allowed times lets a fetcher take a host whose time has come, fetch one URL, and put the host back with now plus crawl delay (from robots.txt or a default, adapted to server response).
  prompt: How does the frontier enforce a delay between requests to one host?
  objectives:
  - 1
  requires:
  - sd.design-crawler.mercator-front-queues
- id: sd.design-crawler.partition-by-host
  subtopic: '3. The frontier: priority and politeness'
  kind: tradeoff
  claim: Hashing the host (not the URL) to a crawler node keeps each host's politeness state, connection reuse, and DNS and robots caches on one node, making politeness a local decision.
  prompt: Why partition crawler nodes by host hash rather than URL hash?
  objectives:
  - 1
  requires:
  - sd.partitioning.shard-key-matches-access
- id: sd.design-crawler.per-host-throughput-cap
  subtopic: '3. The frontier: priority and politeness'
  kind: principle
  claim: 'Politeness, not fetcher capacity, bounds per-site freshness: one request per 2 s allows 43,200 pages/day, so 3M pages take about 69 days, so prioritise within a site using sitemap lastmod and change rates.'
  prompt: A site allows one request every 2 seconds and has 3 million pages. How long is a full recrawl, and what follows from it?
  objectives:
  - 0
  - 1
  - 3
- id: sd.design-crawler.url-normalisation
  subtopic: 4. Deduplication
  kind: procedure
  claim: 'Normalise URLs before the seen check: lowercase scheme and host, remove default ports and fragments, resolve relative paths, and sort or strip tracking and session parameters. Do not lowercase the path.'
  prompt: What normalisation steps should be applied to a URL before the seen check?
  objectives:
  - 2
- id: sd.design-crawler.bloom-seen-set
  subtopic: 4. Deduplication
  kind: mechanism
  claim: A Bloom filter in memory answers 'definitely new' for URLs, backed by a durable store to confirm 'maybe seen'; at about 10 bits per URL, 20B URLs fit in about 25 GB.
  prompt: How can a crawler check whether a URL is new among tens of billions?
  objectives:
  - 2
  requires:
  - sd.design-crawler.url-normalisation
  - sd.storage-engines.bloom-filter-semantics
- id: sd.design-crawler.bloom-false-positive-effect
  subtopic: 4. Deduplication
  kind: fact
  claim: A Bloom filter false positive treats an unseen URL as seen so it is skipped, costing a few missed pages; false negatives cannot happen, so URLs are never refetched by mistake.
  prompt: What does a Bloom filter false positive mean for a crawler?
  objectives:
  - 2
  requires:
  - sd.design-crawler.bloom-seen-set
- id: sd.design-crawler.content-fingerprints
  subtopic: 4. Deduplication
  kind: mechanism
  claim: An exact hash catches identical page bodies, while SimHash-style fingerprints compared within a small Hamming distance catch near-duplicates that differ only in ads or timestamps.
  prompt: How do you detect near-duplicate pages as opposed to identical ones?
  objectives:
  - 2
- id: sd.design-crawler.recrawl-by-change-rate
  subtopic: 5. Freshness and traps
  kind: procedure
  claim: 'Record whether each visit found the page changed (via content fingerprint), estimate change frequency, and schedule revisits by change rate and importance: fast-changing important pages often, static pages rarely.'
  prompt: How should a crawler decide when to recrawl a page?
  objectives:
  - 3
  requires:
  - sd.design-crawler.content-fingerprints
- id: sd.design-crawler.crawler-trap-defences
  subtopic: 5. Freshness and traps
  kind: mechanism
  claim: Infinite URL spaces such as endless calendar pages are bounded with depth limits, per-host page budgets, and URL-pattern detection; a bigger Bloom filter or more fetchers does not help.
  prompt: How does a crawler defend against infinite URL spaces?
  objectives:
  - 3
- id: sd.design-crawler.host-error-backoff
  subtopic: 6. Robustness
  kind: principle
  claim: For a host returning 503s or slow responses, increase its delay and retry later with capped attempts, rather than retrying immediately and hammering it.
  prompt: How should a crawler treat a host that is erroring or slow?
  objectives:
  - 3
  requires:
  - sd.retry-identity.backoff-with-jitter
- id: sd.design-crawler.fetch-safeguards
  subtopic: 6. Robustness
  kind: principle
  claim: Fetchers need timeouts, response size limits and a robots.txt check so one slow or huge server cannot stall a thread or get the crawler blocked.
  prompt: What safeguards should each fetch have?
  objectives:
  - 3
- id: sd.design-crawler.checkpoint-frontier
  subtopic: 6. Robustness
  kind: mechanism
  claim: Keep the frontier in a durable, partitioned store with in-memory heads, so a crash resumes the crawl rather than restarting it.
  prompt: How does a crawler survive crashes without losing its frontier?
  objectives:
  - 3
- id: sd.design-crawler.dns-cache
  subtopic: 6. Robustness
  kind: fact
  claim: DNS resolution is a hidden bottleneck at about 11k fetches/s, so crawlers cache DNS results.
  prompt: Why does a high-rate crawler cache DNS?
  objectives:
  - 0
  - 3
  requires:
  - sd.design-crawler.fetch-rate-estimate
- id: sd.design-crawler.url-pipeline-order
  subtopic: '3. The frontier: priority and politeness'
  kind: procedure
  claim: 'A URL''s journey: normalise and check the seen-filter, score into a priority queue then the host''s back queue, fetch at the host''s allowed time, store raw page and extract links, then fingerprint content and schedule recrawl.'
  prompt: In what order does a URL move through the crawler pipeline?
  objectives:
  - 1
  - 2
  - 3
  requires:
  - sd.design-crawler.url-normalisation
  - sd.design-crawler.bloom-seen-set
  - sd.design-crawler.mercator-front-queues
