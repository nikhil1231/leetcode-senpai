points:
- id: sd.design-payments.timeout-is-unknown-outcome
  subtopic: 1. Requirements
  kind: principle
  claim: A processor timeout is an unknown outcome, because the charge may have succeeded. Record it as UNKNOWN and resolve it by retrying with the same idempotency key, querying the processor, or waiting for the webhook, never by sending a new charge or declaring failure.
  prompt: A processor call times out. How should the system treat the payment and resolve it?
  objectives:
  - 0
  - 1
  same_as: sd.request-flow.timeout-unknown-outcome
- id: sd.design-payments.payment-state-sequence
  subtopic: 2. The payment state machine
  kind: fact
  claim: A successful card payment moves CREATED → AUTHORIZING → AUTHORIZED → CAPTURED → SETTLED, with branches FAILED, UNKNOWN, CANCELED and REFUNDED.
  prompt: What are the states of a successful card payment, in order?
  objectives:
  - 1
- id: sd.design-payments.persist-state-before-call
  subtopic: 2. The payment state machine
  kind: principle
  claim: Persist the AUTHORIZING state before calling the processor, so that after a crash the system knows a call may have happened and a recovery job can resolve it with the same idempotency key.
  prompt: Why write the payment state to the database before calling the processor?
  objectives:
  - 1
  requires:
  - sd.design-payments.payment-state-sequence
- id: sd.design-payments.conditional-transitions
  subtopic: 2. The payment state machine
  kind: mechanism
  claim: Every state transition is a conditional update from the expected state, so duplicate webhooks or retries cannot move a payment backwards (for example, an authorized event for an already captured payment is a no-op).
  prompt: How do state transitions stay safe against duplicate or late events?
  objectives:
  - 1
  - 3
  requires:
  - sd.design-payments.payment-state-sequence
- id: sd.design-payments.recovery-job-sweeps-stuck
  subtopic: 2. The payment state machine
  kind: mechanism
  claim: A recovery job finds payments stuck in AUTHORIZING or UNKNOWN and retries them with the same deterministic idempotency key, so the processor returns the original result or runs the call exactly once.
  prompt: How does the system recover a payment left in AUTHORIZING after a crash?
  objectives:
  - 0
  - 1
  requires:
  - sd.design-payments.persist-state-before-call
- id: sd.design-payments.client-api-idempotency-key
  subtopic: 3. Idempotency at every hop
  kind: mechanism
  claim: The checkout carries a per-order idempotency key, stored with the payment under a unique constraint; retries return the same payment, and the same key with a different payload returns 422.
  prompt: How does the API handle client retries of a checkout request?
  objectives:
  - 0
  requires:
  - sd.retry-identity.concurrent-duplicates-claim
- id: sd.design-payments.processor-deterministic-key
  subtopic: 3. Idempotency at every hop
  kind: mechanism
  claim: Calls to the processor carry a deterministic key derived from the payment and step (such as p-9 or p-9:capture), so retries after timeouts return the original result instead of charging again.
  prompt: What idempotency key should the service send to the processor, and why?
  objectives:
  - 0
  same_as: sd.retry-identity.external-side-effect-downstream-key
- id: sd.design-payments.webhook-handling
  subtopic: 3. Idempotency at every hop
  kind: procedure
  claim: 'Webhooks are at-least-once: verify the signature, deduplicate by event ID, and apply the change as a conditional state transition.'
  prompt: How should incoming processor webhooks be handled safely?
  objectives:
  - 3
  requires:
  - sd.sync-async.webhook-signature-verification
  - sd.sync-async.webhook-idempotent-receiver
- id: sd.design-payments.no-floats-for-money
  subtopic: 3. Idempotency at every hop
  kind: principle
  claim: Store money as integer minor units (cents) plus a currency, not floats, because binary floating point cannot represent amounts like 0.10 exactly and rounding errors accumulate.
  prompt: How should monetary amounts be represented, and why?
  objectives:
  - 2
- id: sd.design-payments.no-mutable-balance
  subtopic: 4. The ledger
  kind: principle
  claim: Updating a balance column in place leaves no record of why it changed, so it cannot be audited or reconciled. Use an append-only ledger and derive balances from it.
  prompt: Why is mutating a balance column a bad way to record money movement?
  objectives:
  - 2
- id: sd.design-payments.double-entry-zero-sum
  subtopic: 4. The ledger
  kind: mechanism
  claim: A double-entry ledger records each movement as a transaction of two or more entries summing to zero, so the sum of all balances is always zero, a cheap integrity check.
  prompt: What invariant does a double-entry ledger enforce, and what does it give you?
  objectives:
  - 2
  requires:
  - sd.design-payments.no-mutable-balance
- id: sd.design-payments.append-only-corrections-refunds
  subtopic: 4. The ledger
  kind: principle
  claim: 'Ledger entries are append-only: corrections and refunds are new reversing entries, never edits or deletions of old ones, which preserves the audit history.'
  prompt: How are mistakes and refunds recorded in the ledger?
  objectives:
  - 2
  requires:
  - sd.design-payments.double-entry-zero-sum
- id: sd.design-payments.sale-fee-payout-entries
  subtopic: 4. The ledger
  kind: procedure
  claim: For a $100 sale with a 10% fee, capture posts processor_receivable +10000, seller_payable −9000 and marketplace_revenue −1000. Payout then posts seller_payable +9000 and cash −9000.
  prompt: What ledger entries record a $100 capture with a 10% fee, and the later seller payout?
  objectives:
  - 2
  requires:
  - sd.design-payments.double-entry-zero-sum
- id: sd.design-payments.ledger-atomic-with-state
  subtopic: 4. The ledger
  kind: principle
  claim: Write ledger entries (and the outbox event) in the same database transaction as the payment state change, so state and money never disagree after a crash.
  prompt: Why write ledger entries in the same transaction as the payment state change?
  objectives:
  - 1
  - 2
  requires:
  - sd.design-payments.double-entry-zero-sum
  - sd.outbox.outbox-same-transaction
- id: sd.design-payments.balances-derived-snapshots
  subtopic: 4. The ledger
  kind: tradeoff
  claim: Balances are derived from entries; summing billions of entries per view is too slow, so use maintained balances or periodic snapshots plus deltas.
  prompt: How do you serve balances quickly from an append-only ledger?
  objectives:
  - 2
  requires:
  - sd.design-payments.double-entry-zero-sum
- id: sd.design-payments.ledger-volume-estimate
  subtopic: 4. The ledger
  kind: fact
  claim: At 4M payments/day with about 6 entries each, the ledger grows by about 8.76 billion entries a year (under 2 TB at 200 bytes), manageable in a partitioned relational database; correctness, not volume, is the hard part.
  prompt: Roughly how fast does a ledger grow at 4M payments/day and 6 entries each, and is volume the main challenge?
  objectives:
  - 2
- id: sd.design-payments.daily-reconciliation
  subtopic: 5. Reconciliation
  kind: procedure
  claim: Daily, import the processor's settlement report, match lines to internal payments by processor reference and amount, flag missing-on-our-side, missing-on-theirs and amount mismatches, auto-resolve what is safe and queue the rest for humans.
  prompt: What does the daily reconciliation process do?
  objectives:
  - 3
- id: sd.design-payments.why-reconcile-divergence
  subtopic: 5. Reconciliation
  kind: principle
  claim: Records diverge from the processor even with correct code, through missed webhooks, reversals, chargebacks, currency adjustments and bugs, so reconciliation assumes divergence and finds it systematically.
  prompt: Why reconcile if the code is correct?
  objectives:
  - 3
  requires:
  - sd.design-payments.daily-reconciliation
- id: sd.design-payments.saga-for-order-payment
  subtopic: 6. Architecture
  kind: tradeoff
  claim: Keep order, inventory and payment consistent with a saga of idempotent steps and compensations (release inventory, void authorisation, refund), not two-phase commit across the card processor.
  prompt: How do you keep order creation, inventory reservation and payment consistent across services?
  objectives:
  - 1
  requires:
  - sd.partitioning.cross-shard-transactions-analytics
- id: sd.design-payments.checkout-flow-order
  subtopic: 6. Architecture
  kind: procedure
  claim: 'Safe checkout: create the payment with the client''s idempotency key (CREATED), persist AUTHORIZING, call the processor with a deterministic key, record AUTHORIZED with ledger entries and outbox event in one transaction, then apply later webhooks conditionally and reconcile nightly.'
  prompt: What are the steps of a safe checkout charge, in order?
  objectives:
  - 0
  - 1
  - 2
  - 3
  requires:
  - sd.design-payments.client-api-idempotency-key
  - sd.design-payments.persist-state-before-call
  - sd.design-payments.processor-deterministic-key
