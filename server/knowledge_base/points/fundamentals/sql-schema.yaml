points:
- id: fundamentals.sql-schema.primary-key-definition
  subtopic: Keys
  kind: fact
  claim: 'Every table needs a primary key: a column or set of columns that is unique and never NULL, which other tables use to refer to its rows.'
  prompt: What two properties must a primary key have?
  objectives:
  - 0
- id: fundamentals.sql-schema.surrogate-plus-unique-natural
  subtopic: Keys
  kind: tradeoff
  claim: Surrogate keys (an identity bigint or UUID) never change and keep joins narrow; natural keys like emails can change or turn out not unique; the usual answer is a surrogate primary key plus a UNIQUE constraint on the natural key.
  prompt: Should you use a surrogate or a natural primary key, and how do you still prevent duplicates?
  objectives:
  - 0
  requires:
  - fundamentals.sql-schema.primary-key-definition
- id: fundamentals.sql-schema.uuidv7-over-uuidv4
  subtopic: Keys
  kind: tradeoff
  claim: Random UUIDv4 keys scatter inserts across a B-tree index, while time-ordered UUIDv7 or ULIDs land at the right edge, so they are a good default when IDs are generated outside the database.
  prompt: Why are UUIDv7 keys often preferred over UUIDv4 as primary keys?
  objectives:
  - 0
  requires:
  - fundamentals.sql-schema.surrogate-plus-unique-natural
- id: fundamentals.sql-schema.composite-keys
  subtopic: Keys
  kind: fact
  claim: A composite key such as (order_id, line_no) fits child rows that only exist inside a parent, and join tables.
  prompt: When does a composite primary key fit?
  objectives:
  - 0
  requires:
  - fundamentals.sql-schema.primary-key-definition
- id: fundamentals.sql-schema.constraints-beat-app-checks
  subtopic: Constraints
  kind: principle
  claim: Constraints are enforced on every write from every client forever, while application checks race and are bypassed by scripts and migrations.
  prompt: Why enforce rules with database constraints rather than application checks?
  objectives:
  - 1
- id: fundamentals.sql-schema.unique-stops-concurrent-duplicates
  subtopic: Constraints
  kind: mechanism
  claim: A UNIQUE constraint is checked atomically by the database, so it is the only reliable way to stop two concurrent sign-ups inserting the same email; an application check-then-insert races. It also creates an index.
  prompt: Two sign-ups with the same email arrive at once. What reliably prevents a duplicate account?
  objectives:
  - 1
  requires:
  - fundamentals.sql-schema.constraints-beat-app-checks
- id: fundamentals.sql-schema.check-and-not-null
  subtopic: Constraints
  kind: fact
  claim: NOT NULL forbids a missing value and CHECK enforces a row-level predicate such as quantity > 0 or ends_at > starts_at.
  prompt: Which constraint enforces that a booking's end date is after its start date?
  objectives:
  - 1
- id: fundamentals.sql-schema.on-delete-behaviours
  subtopic: Constraints
  kind: tradeoff
  claim: ON DELETE RESTRICT (the default, with NO ACTION) refuses while children exist and suits financial records; CASCADE deletes children and suits owned parts like order lines; SET NULL keeps the child and forgets the parent.
  prompt: Which ON DELETE behaviour fits order line items, and which fits invoices?
  objectives:
  - 1
  requires:
  - fundamentals.sql-schema.constraints-beat-app-checks
- id: fundamentals.sql-schema.postgres-fk-not-indexed
  subtopic: Constraints
  kind: fact
  claim: Postgres doesn't index foreign key columns automatically, only the referenced primary or unique key, so index foreign keys used in joins and parent deletes yourself.
  prompt: Does Postgres index foreign key columns automatically?
  objectives:
  - 1
- id: fundamentals.sql-schema.normalisation-one-fact-one-place
  subtopic: Normalisation
  kind: principle
  claim: Normalisation means storing each fact in exactly one place.
  prompt: What is the aim of normalisation?
  objectives:
  - 2
- id: fundamentals.sql-schema.first-normal-form
  subtopic: Normalisation
  kind: fact
  claim: 1NF requires every column to hold one atomic value with no repeating groups; a comma-separated items column or item1, item2, item3 columns break it, because you can't index, join or constrain inside them.
  prompt: A colours column holds 'red, green, blue'. Which normal form is broken?
  objectives:
  - 2
  requires:
  - fundamentals.sql-schema.normalisation-one-fact-one-place
- id: fundamentals.sql-schema.second-normal-form
  subtopic: Normalisation
  kind: fact
  claim: 2NF requires that no non-key column depends on only part of a composite key; product_name in order_lines(order_id, product_id, ...) depends on product_id alone and belongs in products.
  prompt: What does 2NF forbid?
  objectives:
  - 2
  requires:
  - fundamentals.sql-schema.first-normal-form
- id: fundamentals.sql-schema.third-normal-form
  subtopic: Normalisation
  kind: fact
  claim: '3NF requires that no non-key column depends on another non-key column, such as customer_email in orders depending on customer_id: every column depends on the key, the whole key and nothing but the key.'
  prompt: Why does orders(id, customer_id, customer_email) violate 3NF?
  objectives:
  - 2
  requires:
  - fundamentals.sql-schema.second-normal-form
- id: fundamentals.sql-schema.update-insert-delete-anomalies
  subtopic: Normalisation
  kind: fact
  claim: Unnormalised data causes update anomalies (an email stored on 400 orders updated in only some), insert anomalies (no product until someone orders it) and delete anomalies (deleting the last order loses the product's price).
  prompt: Name the three anomalies an unnormalised schema causes.
  objectives:
  - 2
  requires:
  - fundamentals.sql-schema.normalisation-one-fact-one-place
- id: fundamentals.sql-schema.price-at-order-is-different-fact
  subtopic: Normalisation
  kind: principle
  claim: 'Storing order_lines.unit_price alongside products.price is not a normalisation mistake: it records the price at the time of the order, a different fact.'
  prompt: Is storing unit_price on order lines a normalisation mistake?
  objectives:
  - 2
  - 4
  requires:
  - fundamentals.sql-schema.normalisation-one-fact-one-place
- id: fundamentals.sql-schema.one-to-many-fk-on-many-side
  subtopic: Relationships
  kind: fact
  claim: In a one-to-many relationship the foreign key goes on the many side, such as orders.customer_id; a one-to-one is a unique foreign key and often a sign the tables should be one.
  prompt: Where does the foreign key go in a one-to-many relationship?
  objectives:
  - 3
- id: fundamentals.sql-schema.many-to-many-join-table
  subtopic: Relationships
  kind: procedure
  claim: Model many-to-many with a join table holding a foreign key to each side and a composite primary key, such as enrolments(student_id, course_id); attributes of the relationship like grade live there.
  prompt: How do you model a many-to-many relationship between students and courses?
  objectives:
  - 3
  requires:
  - fundamentals.sql-schema.one-to-many-fk-on-many-side
  - fundamentals.sql-schema.composite-keys
- id: fundamentals.sql-schema.denormalise-after-measuring
  subtopic: Denormalising on purpose
  kind: tradeoff
  claim: 'Denormalising trades write complexity and consistency risk for read speed; do it after measuring, and choose how the copy stays correct: same-transaction counters or triggers, scheduled materialised views, or read models fed by events or CDC.'
  prompt: What does denormalising cost, and what are the ways to keep a copy correct?
  objectives:
  - 4
  requires:
  - fundamentals.sql-schema.normalisation-one-fact-one-place
- id: fundamentals.sql-schema.counter-in-same-transaction
  subtopic: Denormalising on purpose
  kind: tradeoff
  claim: A denormalised counter like threads.reply_count is simplest kept correct by incrementing it in the same transaction as the insert, so both commit or neither does; the row lock serialises writes to a very hot row, which you can fix by sharding the counter.
  prompt: How do you keep a denormalised reply count correct, and what is its cost?
  objectives:
  - 4
  requires:
  - fundamentals.sql-schema.denormalise-after-measuring
- id: fundamentals.sql-schema.library-schema-design
  subtopic: Denormalising on purpose
  kind: procedure
  claim: A lending library separates books (ISBN unique) from physical copies, with members and loans referencing a copy and member; a partial unique index on copy_id WHERE returned_at IS NULL stops a copy being lent twice, and RESTRICT keeps loan history.
  prompt: How would you stop a library copy being lent twice at once in the schema?
  objectives:
  - 1
  - 3
  requires:
  - fundamentals.sql-schema.many-to-many-join-table
  - fundamentals.sql-schema.unique-stops-concurrent-duplicates
