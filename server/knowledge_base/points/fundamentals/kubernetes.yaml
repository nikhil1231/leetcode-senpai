points:
- id: fundamentals.kubernetes.container-is-process
  subtopic: Containers
  kind: principle
  claim: A container is not a VM but an ordinary Linux process isolated by namespaces and limited by cgroups, sharing the host kernel.
  prompt: What is a container, technically, and how does it differ from a VM?
  objectives:
  - 0
- id: fundamentals.kubernetes.namespaces-isolate-view
  subtopic: Containers
  kind: mechanism
  claim: Namespaces give a container its own view of PIDs, network interfaces, mounts, hostname and users.
  prompt: Which Linux feature gives a container its own view of PIDs, network, mounts and hostname?
  objectives:
  - 0
  requires:
  - fundamentals.kubernetes.container-is-process
- id: fundamentals.kubernetes.cgroups-cap-resources
  subtopic: Containers
  kind: mechanism
  claim: cgroups cap and account a container's CPU, memory and I/O.
  prompt: Which Linux feature limits and accounts a container's CPU, memory and I/O?
  objectives:
  - 0
  requires:
  - fundamentals.kubernetes.container-is-process
- id: fundamentals.kubernetes.image-layers-cache-order
  subtopic: Containers
  kind: tradeoff
  claim: Images are read-only layers, one per Dockerfile instruction, cached and shared; order instructions from least to most frequently changed (install dependencies before copying source) so the cache is reused, and use multi-stage builds to keep compilers out of the runtime image.
  prompt: How should a Dockerfile be ordered to make builds cache-friendly?
  objectives:
  - 0
- id: fundamentals.kubernetes.shared-kernel-hardening
  subtopic: Containers
  kind: principle
  claim: Containers share the host kernel, so escapes matter; run as non-root with a read-only root filesystem where possible.
  prompt: Why do container escapes matter, and what hardening reduces the risk?
  objectives:
  - 0
  requires:
  - fundamentals.kubernetes.container-is-process
- id: fundamentals.kubernetes.reconciliation-loop
  subtopic: Kubernetes in one picture
  kind: mechanism
  claim: You declare desired state, and controllers continually compare it with actual state and act to close the gap.
  prompt: How does Kubernetes keep the cluster in the declared state?
  objectives:
  - 1
- id: fundamentals.kubernetes.control-plane-components
  subtopic: Kubernetes in one picture
  kind: fact
  claim: The control plane is the API server (the only component that talks to etcd), etcd (cluster state, using Raft), the scheduler (assigns pods to nodes) and controller managers.
  prompt: What are the control plane components and what does each do?
  objectives:
  - 1
  requires:
  - fundamentals.kubernetes.reconciliation-loop
- id: fundamentals.kubernetes.node-components
  subtopic: Kubernetes in one picture
  kind: fact
  claim: Each node runs a kubelet (runs assigned pods and reports status), a container runtime such as containerd, and kube-proxy or an eBPF data plane for Service routing.
  prompt: What runs on each Kubernetes node?
  objectives:
  - 1
- id: fundamentals.kubernetes.workload-object-types
  subtopic: Kubernetes in one picture
  kind: fact
  claim: A Deployment (via ReplicaSet) keeps N identical pods and rolls out versions; a StatefulSet gives stable identities and per-pod volumes; a DaemonSet runs one pod per node; Jobs and CronJobs run to completion.
  prompt: Which workload object suits databases needing stable names and per-pod volumes, and which runs one pod per node?
  objectives:
  - 1
  requires:
  - fundamentals.kubernetes.reconciliation-loop
- id: fundamentals.kubernetes.service-stable-endpoint
  subtopic: Kubernetes in one picture
  kind: mechanism
  claim: A Service gives a stable virtual IP and DNS name in front of a changing set of pods selected by label; Ingress or Gateway routes external HTTP to Services.
  prompt: What does a Service provide in front of disposable pods?
  objectives:
  - 1
- id: fundamentals.kubernetes.secrets-base64-only
  subtopic: Kubernetes in one picture
  kind: fact
  claim: Secrets are only base64-encoded by default, not encrypted, so enable encryption at rest and restrict access with RBAC.
  prompt: How are Kubernetes Secrets protected by default, and what must you add?
  objectives:
  - 1
- id: fundamentals.kubernetes.requests-scheduling
  subtopic: Requests, limits and QoS
  kind: mechanism
  claim: The scheduler places a pod only on a node with enough unreserved capacity for its requests (not limits or actual usage); requests too high waste capacity, too low overcommit nodes.
  prompt: What does the scheduler compare to decide whether a pod fits on a node?
  objectives:
  - 2
- id: fundamentals.kubernetes.memory-limit-oomkilled
  subtopic: Requests, limits and QoS
  kind: mechanism
  claim: Exceeding the memory limit gets the container OOMKilled, since memory is not compressible.
  prompt: What happens when a container exceeds its memory limit?
  objectives:
  - 2
  - 3
  same_as: fundamentals.linux-processes.cgroup-limit-oom
- id: fundamentals.kubernetes.cpu-limit-throttling
  subtopic: Requests, limits and QoS
  kind: mechanism
  claim: 'Exceeding the CPU limit throttles the container: it is paused for the rest of each 100 ms period, causing latency spikes rather than errors, even when the node has idle CPU.'
  prompt: What happens when a container hits its CPU limit, and how does it show up?
  objectives:
  - 2
  requires:
  - fundamentals.kubernetes.cgroups-cap-resources
- id: fundamentals.kubernetes.limits-practice
  subtopic: Requests, limits and QoS
  kind: tradeoff
  claim: A common practice is memory request = limit, and a CPU request with no CPU limit, to avoid throttling latency-sensitive services.
  prompt: What request and limit settings do many teams use to avoid CPU throttling?
  objectives:
  - 2
  requires:
  - fundamentals.kubernetes.memory-limit-oomkilled
  - fundamentals.kubernetes.cpu-limit-throttling
- id: fundamentals.kubernetes.qos-classes
  subtopic: Requests, limits and QoS
  kind: fact
  claim: 'QoS classes set eviction order under node pressure: Guaranteed (requests = limits for all resources), Burstable, and BestEffort (no requests), which is evicted first.'
  prompt: What are the QoS classes and which is evicted first?
  objectives:
  - 2
  requires:
  - fundamentals.kubernetes.requests-scheduling
- id: fundamentals.kubernetes.readiness-probe-role
  subtopic: Probes
  kind: principle
  claim: A readiness probe controls whether a pod receives traffic; use it for temporary dependency problems and for draining after SIGTERM, since restarting would not help.
  prompt: Which probe handles a temporarily unreachable dependency or a draining pod?
  objectives:
  - 2
- id: fundamentals.kubernetes.liveness-probe-role
  subtopic: Probes
  kind: principle
  claim: A liveness probe should only detect a wedged process (deadlock, blocked event loop) that needs a restart.
  prompt: What should a liveness probe check?
  objectives:
  - 2
- id: fundamentals.kubernetes.startup-probe-role
  subtopic: Probes
  kind: principle
  claim: A startup probe holds off liveness checks until a slow-starting app (such as a 90-second JVM warm-up) is up, so it is not killed while starting.
  prompt: Which probe protects slow-starting apps from being killed during boot?
  objectives:
  - 2
  requires:
  - fundamentals.kubernetes.liveness-probe-role
- id: fundamentals.kubernetes.liveness-dependency-outage
  subtopic: Probes
  kind: tradeoff
  claim: 'A liveness probe that checks dependencies turns a database blip into an outage: every pod fails liveness and the whole fleet restarts at once.'
  prompt: Why is it dangerous for a liveness probe to check the database?
  objectives:
  - 2
  requires:
  - fundamentals.kubernetes.liveness-probe-role
- id: fundamentals.kubernetes.rolling-update-readiness
  subtopic: Rollouts and scaling
  kind: mechanism
  claim: A rolling update replaces pods gradually (maxSurge, maxUnavailable) and waits for new pods to be ready; without a readiness probe, running counts as ready and a broken version rolls out fully. kubectl rollout undo rolls back.
  prompt: Why can a broken version roll out fully, and how do you roll back?
  objectives:
  - 1
  - 3
  requires:
  - fundamentals.kubernetes.readiness-probe-role
- id: fundamentals.kubernetes.pdb-voluntary-disruption
  subtopic: Rollouts and scaling
  kind: fact
  claim: PodDisruptionBudgets limit how many pods voluntary disruptions such as node drains can take down at once.
  prompt: What does a PodDisruptionBudget limit?
  objectives:
  - 1
- id: fundamentals.kubernetes.autoscaling-requests-relative
  subtopic: Rollouts and scaling
  kind: mechanism
  claim: The HPA scales replicas on CPU, memory or custom metrics, with CPU utilisation measured relative to requests; the cluster autoscaler adds nodes when pods are Pending for lack of capacity.
  prompt: Relative to what is CPU utilisation measured for the HPA, and what triggers the cluster autoscaler?
  objectives:
  - 1
  - 2
  requires:
  - fundamentals.kubernetes.requests-scheduling
- id: fundamentals.kubernetes.crashloop-debugging
  subtopic: Rollouts and scaling
  kind: procedure
  claim: For CrashLoopBackOff, read the previous container's logs (kubectl logs --previous) and kubectl describe pod for exit code, OOMKilled and probe failures; roll back first, then fix forward through Git rather than hand-editing live objects.
  prompt: How do you debug a pod in CrashLoopBackOff and restore service?
  objectives:
  - 3
  requires:
  - fundamentals.linux-processes.exit-code-137
- id: fundamentals.kubernetes.pending-and-pull-causes
  subtopic: Rollouts and scaling
  kind: fact
  claim: Pending means the pod cannot be scheduled (insufficient CPU or memory for requests, taints, node selectors, unbound volume); ImagePullBackOff means a bad image name or missing registry credentials.
  prompt: What do Pending and ImagePullBackOff each indicate?
  objectives:
  - 3
  requires:
  - fundamentals.kubernetes.requests-scheduling
