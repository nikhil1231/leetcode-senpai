[project]
name = "leetcode-senpai"
version = "0.1.0"
description = "Personal LeetCode practice and spaced-repetition coach"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "firebase-admin==6.6.0",
    # Used directly by server/access.py to verify Cloudflare Access assertions.
    # firebase-admin pulls it in too, but an import deserves its own line.
    "pyjwt[crypto]==2.14.0",
    "fsrs==4.1.1",
    # Authored system design lessons are Markdown with YAML blocks.
    "pyyaml==6.0.3",
    "pillow==11.3.0",
    "piper-tts==1.8.0",
    "lameenc==1.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.uv]
package = false
