<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Senpai wall</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- The wall (server/wall.py): posters of what you are learning, full screen, for a TV, a
       projector, a screensaver or a phone on StandBy. ?every=45 seconds a poster, ?reveal=18
       seconds until its idea shows, ?map=5 (every fifth slide is the fading map; 0 never),
       ?only=map, ?print=1 six posters to print, ?log=1 records each poster as an exposure. -->
  <style>
    :root { --ink: #12131a; --ink-2: rgba(18, 19, 26, .62); --bg: #0a0c11; --text: #e9ecf3; --muted: #8b93a8; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
      font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; cursor: none; }
    .slide { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; transition: opacity 1.2s ease;
      padding: max(5vh, env(safe-area-inset-top)) 6vw max(5vh, env(safe-area-inset-bottom)); }
    .slide.on { opacity: 1; }
    .poster { color: var(--ink); background: var(--c); }
    .poster::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(110% 80% at 100% 0%, rgba(255,255,255,.45), transparent 60%); }
    .poster > * { position: relative; }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; font-size: clamp(14px, 1.6vw, 26px); color: var(--ink-2); }
    .row b { color: var(--ink); }
    .ask { margin-top: 4vh; font-weight: 780; letter-spacing: -.015em; line-height: 1.12; font-size: clamp(28px, min(4.8vw, 8vh), 100px); max-width: 24ch; }
    .claim { margin-top: 4vh; max-width: 50ch; font-size: clamp(18px, min(2.2vw, 3.8vh), 46px); line-height: 1.3; font-weight: 560;
      background: rgba(255,255,255,.55); border-radius: 2vw; padding: 2.4vh 2.4vw; opacity: 0; transform: translateY(10px);
      transition: opacity 1.4s ease, transform 1.4s ease; }
    .poster.revealed .claim { opacity: 1; transform: none; }
    .foot { margin-top: auto; }
    .bar { height: 4px; border-radius: 4px; background: rgba(18,19,26,.15); margin-top: 1.4vh; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: var(--ink); opacity: .55; }
    .map { background: var(--bg); }
    .map h1 { font-size: clamp(22px, 2.6vw, 48px); line-height: 1.15; }
    .map .sub { color: var(--muted); font-size: clamp(14px, 1.3vw, 22px); margin-top: .6vh; }
    .map svg { flex: 1; width: 100%; min-height: 0; margin-top: 2vh; }
    .msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; cursor: auto; }
    .msg a { color: var(--text); }
    /* print: six posters on one A4 page */
    html:has(body.print), body.print { height: auto; overflow: visible; background: #fff; cursor: auto; }
    .card .bar, .card .clock, .card .foot .row span:last-child { display: none; }
    .sheet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 5mm; padding: 8mm; height: 297mm; }
    .card { color: var(--ink); background: var(--c); border-radius: 5mm; padding: 5mm 6mm; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; }
    .card .ask { margin: 2mm 0 0; font-size: 14.5pt; max-width: none; }
    .card .claim { opacity: 1; transform: none; margin-top: 3mm; font-size: 9.5pt; border-radius: 3mm; padding: 3mm; max-width: none; }
    .card .row { font-size: 8.5pt; }
    @page { size: A4; margin: 0; }
    @media print { .noprint { display: none; } }
    .noprint { padding: 8mm 8mm 0; color: #444; font-size: 12pt; }
  </style>
  <script src="https://whats.nikhil.ing/tweak.js" defer></script>  <!-- the Tweak button: ~/infra README, Tweak -->
</head>
<body>
  <div class="msg" id="msg">Loading…</div>
  <script>
  (function () {
    'use strict';
    const q = new URLSearchParams(location.search);
    const num = (k, d, lo, hi) => Math.min(hi, Math.max(lo, parseFloat(q.get(k) ?? d) || d));
    const EVERY = num('every', 45, 8, 3600) * 1000, REVEAL = Math.min(num('reveal', 18, 2, 3600) * 1000, EVERY - 3000);
    const MAP = q.has('map') ? Math.round(num('map', 5, 0, 100)) : 5;
    const ONLY_MAP = q.get('only') === 'map', PRINT = q.get('print') === '1', LOG = q.get('log') === '1';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const msg = document.getElementById('msg');
    let data = null, i = 0, shown = 0, timers = [], loggedToday = new Set();

    async function load() {
      const r = await fetch('/api/wall?n=' + (PRINT ? 6 : 24), {credentials: 'same-origin'});
      if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), {status: r.status});
      return r.json();
    }

    function fill(a) {
      if (!a.met) return '#232836';
      return `hsl(${Math.max(0, Math.min(125, a.strength * 1.25))} 78% 58%)`;
    }
    const shade = a => a.met ? (0.45 + 0.55 * Math.min(1, a.coverage / 60)).toFixed(2) : 1;

    function lines(text, max) {
      const out = [''];
      for (const w of text.split(' ')) {
        if ((out[out.length - 1] + ' ' + w).trim().length > max && out[out.length - 1]) out.push(w);
        else out[out.length - 1] = (out[out.length - 1] + ' ' + w).trim();
      }
      return out;
    }

    function mapSvg(m) {
      const by = Object.fromEntries(m.parts.map(p => [p.id, p]));
      const mid = p => [p.x + p.w / 2, p.y + p.h / 2];
      const edges = m.edges.map(([a, b]) => { const [x1, y1] = mid(by[a]), [x2, y2] = mid(by[b]);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#39405a" stroke-width="5" />`; }).join('');
      const parts = m.parts.map(p => {
        const dim = !p.met, ink = dim ? '#8b93a8' : '#12131a', soft = dim ? '#6b7388' : 'rgba(18,19,26,.72)';
        const wide = p.w > 500;
        const name = lines(p.name, Math.floor(p.w / 15)).map((t, k) => `<tspan x="${p.x + 20}" dy="${k ? 28 : 0}">${esc(t)}</tspan>`).join('');
        const stats = dim ? ['not built yet'] : [`${p.strength}% held`,
          `${p.met}/${p.total} met${p.fading + p.shaky ? ` · ${p.fading + p.shaky} slipping` : ''}`];
        const statText = (wide ? [stats.join(' · ')] : stats).map((t, k, all) =>
          `<text x="${p.x + 20}" y="${p.y + p.h - 18 - (all.length - 1 - k) * 25}" font-size="19" fill="${soft}">${esc(t)}</text>`).join('');
        return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="20" fill="#0a0c11" /><g opacity="${shade(p)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="20" fill="${fill(p)}"
            ${dim ? 'stroke="#3a4157" stroke-width="3" stroke-dasharray="10 8"' : ''} />
          <text x="${p.x + 20}" y="${p.y + 38}" font-size="24" font-weight="750" fill="${ink}">${name}</text>${statText}</g>`;
      }).join('');
      let y = 40;
      const rooms = m.rooms.map(r => {
        const head = `<text x="1310" y="${y + 26}" font-size="25" font-weight="750" fill="#e9ecf3">${esc(r.title)}</text>`;
        y += 46;
        const rows = r.areas.map(a => { const row = `<g>
            <text x="1310" y="${y + 20}" font-size="18" fill="#aab2c5">${esc(a.title.length > 28 ? a.title.slice(0, 27) + '…' : a.title)}</text>
            <rect x="1310" y="${y + 30}" width="270" height="10" rx="5" fill="#1e2330" />
            <rect x="1310" y="${y + 30}" width="${a.met ? Math.max(8, 2.7 * a.strength * a.coverage / 100) : 0}" height="10" rx="5" fill="${fill(a)}" /></g>`;
          y += 56; return row; }).join('');
        y += 24;
        return head + rows;
      }).join('');
      const h = Math.max(890, y + 20);
      return `<svg viewBox="0 0 1600 ${h}" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, Segoe UI, Inter, Roboto, sans-serif">${edges}${parts}${rooms}</svg>`;
    }

    function posterHtml(p, cls = 'slide poster') {
      return `<section class="${cls}" style="--c:${esc(p.colour)}">
        <div class="row"><span>${esc(p.tag)}</span><span class="clock"></span></div>
        <div class="row" style="margin-top:1.6vh"><span><b>${esc(p.speaker)}</b> · ${esc(p.role)}</span></div>
        <div class="ask">${esc(p.ask)}</div>
        <div class="claim">${esc(p.claim)}</div>
        <div class="foot"><div class="row"><span>${esc(p.lesson)}</span><span>${esc(data.company.label)} · ${esc(data.company.users)}</span></div>
          <div class="bar"><i></i></div></div>
      </section>`;
    }

    function mapHtml() {
      const c = data.company;
      return `<section class="slide map"><h1>Ripple's system, as you hold it</h1>
        <div class="sub">${esc(c.label)} (${esc(c.users)}) · you hold ${esc(c.pct)}% of every idea. Each part shows how well you hold the ideas you have met there: green holds, red is fading. Faint parts you have barely met.</div>
        ${mapSvg(data.map)}</section>`;
    }

    function tickClock() {
      const t = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      document.querySelectorAll('.clock').forEach(el => { el.textContent = t; });
    }

    function exposure(p) {
      const key = `wall-${new Date().toISOString().slice(0, 10)}-${p.point}`;
      if (!LOG || loggedToday.has(key)) return;
      loggedToday.add(key);
      fetch('/api/knowledge/events', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: 'wall', events: [{key, kind: 'exposure', points: [p.point]}]})}).catch(() => {});
    }

    function show() {
      timers.forEach(clearTimeout); timers = [];
      const isMap = ONLY_MAP || (MAP > 0 && shown > 0 && shown % MAP === MAP - 1);
      const p = data.posters[i % Math.max(1, data.posters.length)];
      const holder = document.createElement('div');
      holder.innerHTML = isMap || !p ? mapHtml() : posterHtml(p);
      const el = holder.firstElementChild;
      document.body.appendChild(el);
      tickClock();
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      document.querySelectorAll('.slide.on').forEach(old => { old.classList.remove('on'); setTimeout(() => old.remove(), 1400); });
      if (!isMap && p) {
        i += 1;
        exposure(p);
        const bar = el.querySelector('.bar i');
        bar.animate([{width: '0%'}, {width: '100%'}], {duration: EVERY, fill: 'forwards'});
        timers.push(setTimeout(() => el.classList.add('revealed'), REVEAL));
      }
      shown += 1;
      if (!ONLY_MAP) timers.push(setTimeout(next, EVERY));
      else timers.push(setTimeout(refresh, 10 * 60 * 1000));
    }

    async function next() {
      if (i >= data.posters.length) { await refresh(true); return; }
      show();
    }

    async function refresh(advance) {
      try { data = await load(); i = 0; } catch { /* keep showing what we have */ }
      show();
    }

    function printSheet() {
      document.body.className = 'print';
      document.body.innerHTML = `<p class="noprint">Six posters for this week. Print in colour on A4 (no margins).</p>
        <div class="sheet">${data.posters.map(p => posterHtml(p, 'card')).join('')}</div>`;
      document.querySelectorAll('.card .claim').forEach(el => { el.style.opacity = 1; });
    }

    async function start() {
      try { data = await load(); } catch (err) {
        msg.innerHTML = err.status === 401 || err.status === 403 ? 'Sign in to <a href="/">the app</a> first, then come back.'
          : 'Could not load the wall. It will try again in a minute.';
        setTimeout(start, 60000);
        return;
      }
      msg.remove();
      if (PRINT) return printSheet();
      if (!data.posters.length && !ONLY_MAP) { msg.textContent = 'Open a lesson and its ideas will appear here.'; document.body.appendChild(msg); return; }
      setInterval(tickClock, 15000);
      show();
      try { await navigator.wakeLock?.request('screen'); } catch { /* not allowed here: the screen may sleep */ }
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') { try { await navigator.wakeLock?.request('screen'); } catch {} }
      });
      document.addEventListener('click', () => document.documentElement.requestFullscreen?.().catch(() => {}));
    }
    start();
  })();
  </script>
</body>
</html>
