services:
  api:
    build: .
    container_name: leetcode-senpai-api
    env_file:
      - .env.local
    environment:
      AUTH_MODE: local
      PORT: 8080
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Set FIREBASE_SERVICE_ACCOUNT_JSON in .env to the host path of your Firebase service-account JSON}
        target: /run/secrets/firebase-service-account.json
        read_only: true
    restart: unless-stopped

  # The pages. Forwards /api/* to the api service, so the browser only ever talks to this one port.
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    container_name: leetcode-senpai-web
    depends_on: [api]
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped
